<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10b981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cas Zéro – Simulateur de cas cliniques</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="topbar-inner">
      <ol class="tracker" id="tracker"></ol>
      <div class="score" id="score" aria-live="polite">
        <span class="score-label" id="scoreLabel"></span>
        <span class="score-value" id="scoreValue">100</span><span class="score-max">/100</span>
      </div>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="current-name" id="currentName"></div>
    <div class="monitor" id="monitor" role="group" hidden></div>
  </header>

  <main id="stage" class="stage"></main>
  <div id="toastLayer" class="toast-layer" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
